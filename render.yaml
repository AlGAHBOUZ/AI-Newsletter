services:
  - type: web
    name: ai-weekly-digest
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 600 --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: DATA_DIR
        value: /tmp         # Render's ephemeral disk — fine for daily cache
      - key: PYTHON_VERSION
        value: 3.12.0
